<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Color Hunt</title>
<meta name="theme-color" content="#222831" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Start screen -->
  <section id="screen-start" class="screen">
    <h1 class="title">🎨 Color Hunt</h1>
    <p class="subtitle">Find the color in the real world with your camera!</p>

    <div class="difficulty-picker">
      <p class="section-label">Choose your difficulty</p>
      <div class="difficulty-buttons" id="difficulty-buttons">
        <button class="diff-btn" data-difficulty="easy">😊 Easy</button>
        <button class="diff-btn selected" data-difficulty="medium">🙂 Medium</button>
        <button class="diff-btn" data-difficulty="hard">😤 Hard</button>
      </div>
    </div>

    <button id="btn-start" class="big-btn">Start Hunting!</button>
    <p id="start-error" class="error-text" hidden></p>
  </section>

  <!-- Game screen: three equal bands, top to bottom = camera / real-world color / goal color -->
  <section id="screen-game" class="screen" hidden>
    <div class="thirds">

      <div class="third camera-third">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="sample-canvas" hidden></canvas>

        <div class="camera-overlay">
          <div class="overlay-top">
            <div class="proximity-wrap">
              <div class="proximity-bar">
                <div id="proximity-fill" class="proximity-fill"></div>
              </div>
              <span id="proximity-label" class="proximity-label">Point at something…</span>
            </div>
            <button id="btn-quit" class="icon-btn" title="Quit">✕</button>
          </div>

          <div class="overlay-bottom">
            <div class="stats-card">
              <span class="stat-line"><strong id="stat-attempts">0</strong> tries</span>
              <span class="stat-line"><strong id="stat-rounds">0</strong> found</span>
            </div>
            <button id="btn-capture" class="capture-btn" aria-label="Capture color"></button>
          </div>
        </div>
      </div>

      <div class="third color-third" id="live-third">
        <span class="third-label">Real world</span>
        <span id="live-name" class="color-name"></span>
      </div>

      <div class="third color-third" id="target-third">
        <span class="third-label">Find this color</span>
        <span id="target-name" class="color-name"></span>
      </div>

    </div>
  </section>

  <!-- Win overlay -->
  <div id="win-overlay" class="overlay" hidden>
    <div class="overlay-card">
      <h2 id="win-title">🎉 You found it!</h2>
      <p id="win-detail">It took you <strong id="win-attempts">0</strong> tries.</p>
      <p id="win-best" class="win-best"></p>
      <button id="btn-next" class="big-btn">Next Color</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
